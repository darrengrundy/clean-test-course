name: Lesson 2

on:
  push:
    branches:
      - lesson-2
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disable Debug
        run: |
          sed -i 's/DEBUG = True/DEBUG = False/g' hangry_api/hangry_api/settings.py
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
      - name: '**PLACEHOLDER** Deploy to Elastic Beanstalk'
        run: echo Placeholder for Deployment

  unit_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/hangry_api
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest django-mock-queries
      - name: Run unit tests
        run: python -m pytest tests/
